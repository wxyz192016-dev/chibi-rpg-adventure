<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#171b22"><title>校園末日：ZOMBIE SURVIVAL｜測試版</title>
<style>
:root{color-scheme:dark;--ink:#f6f0e8;--muted:#b9c0c9;--panel:#202833;--line:#43505d;--gold:#f3c66b;--red:#ed6470;--green:#74d69a}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at top,#35414b,#151a20 70%);color:var(--ink);font-family:system-ui,-apple-system,"Noto Sans TC",sans-serif;min-height:100vh}.wrap{max-width:1040px;margin:auto;padding:14px}.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:10px}.brand{font-weight:900;letter-spacing:.08em}.brand small{display:block;color:var(--muted);font-size:11px;letter-spacing:.18em}.hud{display:flex;gap:8px;flex-wrap:wrap}.pill{background:#202a35;border:1px solid var(--line);border-radius:99px;padding:7px 11px;font-size:13px}.pill b{color:var(--gold)}.game{display:grid;grid-template-columns:minmax(0,1fr) 230px;gap:12px;align-items:stretch}.stage{position:relative;background:#20252b;border:2px solid #53606a;border-radius:18px;overflow:hidden;box-shadow:0 18px 55px #0008;min-height:620px}canvas{display:block;width:100%;height:100%;min-height:620px;touch-action:manipulation}.overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:#0b1119c9;padding:22px;text-align:center}.modal{max-width:390px;background:#202b36;border:1px solid #667481;border-radius:18px;padding:24px;box-shadow:0 15px 50px #0009}.modal h1{margin:0 0 8px;font-size:clamp(25px,5vw,38px)}.modal p{color:#c5cbd2;line-height:1.65}.btn{border:1px solid #647381;background:#303d49;color:#fff;border-radius:12px;padding:10px 13px;font-weight:750;cursor:pointer}.btn.primary{background:linear-gradient(135deg,#e8a94f,#d76b49);border:0;color:#21170f}.btn:disabled{opacity:.4;cursor:not-allowed}.side{display:flex;flex-direction:column;gap:10px}.panel{background:#202a34;border:1px solid var(--line);border-radius:15px;padding:12px}.panel h3{font-size:14px;margin:0 0 10px;color:#f5d18b}.member{display:grid;grid-template-columns:36px 1fr;gap:8px;align-items:center;margin:10px 0}.avatar{width:36px;height:36px;border-radius:12px;background:linear-gradient(145deg,#efc9a1,#9e6872);display:grid;place-items:center;color:#34222a;font-weight:900}.member b{font-size:12px}.member small{display:block;color:var(--muted);font-size:10px}.bar{height:5px;background:#46515c;border-radius:9px;margin-top:4px;overflow:hidden}.bar i{display:block;height:100%;background:var(--green)}.skills{display:grid;grid-template-columns:1fr 1fr;gap:7px}.skill{font-size:12px;padding:11px 5px}.skill span{display:block;font-size:10px;color:#d7c6a7;margin-top:3px}.log{font-size:11px;line-height:1.5;color:#c6cdd4;max-height:125px;overflow:auto}.foot{color:#98a4ae;font-size:11px;text-align:center;margin:12px}.mobile-controls{display:none;gap:8px;margin-top:10px}.mobile-controls .btn{flex:1}.hint{color:#aeb8c2;font-size:11px;line-height:1.55}
@media(max-width:720px){.wrap{padding:8px}.game{grid-template-columns:1fr}.stage{min-height:65vh;height:65vh;max-height:820px}canvas{min-height:0}.side{display:grid;grid-template-columns:1fr 1fr}.side .roster{grid-column:1/-1}.mobile-controls{display:flex}.top{align-items:flex-start}.hud{justify-content:flex-end}.pill{font-size:11px;padding:6px 8px}}
</style>
</head>
<body><main class="wrap">
<header class="top"><div class="brand">校園末日 <small>ZOMBIE SURVIVAL · PROTOTYPE 0.3</small></div><div class="hud"><div class="pill">關卡 <b>廢校一號</b></div><div class="pill">波次 <b id="wave">1 / 5</b></div><div class="pill">防線 <b id="base">100%</b></div><div class="pill">擊倒 <b id="kills">0</b></div></div></header>
<div class="game"><section class="stage"><canvas id="field" width="540" height="900" aria-label="喪屍戰場，點擊喪屍指定集火"></canvas><div class="overlay" id="start"><div class="modal"><h1>校園末日</h1><p>五人小隊已就位。隊員會自動搜索並射擊喪屍；點擊喪屍可下達集火命令，使用技能守住防線。</p><button class="btn primary" id="startBtn">開始防守</button></div></div><div class="overlay" id="end" hidden><div class="modal"><h1 id="endTitle">戰鬥結束</h1><p id="endText"></p><button class="btn primary" id="again">再次出擊</button></div></div></section>
<aside class="side"><section class="panel roster"><h3>◆ 五人作戰小隊</h3><div id="members"></div></section><section class="panel"><h3>◆ 武器狀態</h3><div id="weaponStatus" class="hint"></div><button class="btn" id="reload" style="width:100%;margin-top:8px">↻ 全隊換彈（R）</button></section><section class="panel"><h3>◆ 戰術技能</h3><div class="skills"><button class="btn skill" id="heal">急救包<span>恢復全隊 · Q</span></button><button class="btn skill" id="fire">燃燒彈<span>範圍傷害 · W</span></button><button class="btn skill" id="focus">全員集火<span>攻速提升 · E</span></button><button class="btn skill" id="pause">Ⅱ 暫停<span>空白鍵</span></button></div></section><section class="panel"><h3>◆ 小隊訓練</h3><div class="hint" id="upgradeInfo">擊倒喪屍取得戰術點數，可提升全隊攻擊力。</div><button class="btn" id="upgrade" style="width:100%;margin-top:8px">升級武器（需 12 擊倒）</button></section><section class="panel"><h3>◆ 戰況紀錄</h3><div class="log" id="log">等待隊長下令……</div></section><section class="panel hint">操作：點擊／觸控喪屍指定集火。隊員自動射擊。速度可在戰場右上切換。守住五波並擊敗頭目即可通關。</section></aside></div>
<div class="mobile-controls"><button class="btn" id="mobilePause">Ⅱ 暫停</button><button class="btn" id="mobileHeal">急救</button><button class="btn" id="mobileFire">燃燒彈</button><button class="btn" id="mobileFocus">集火</button></div><div class="foot">單機測試原型 · 遊戲進度不會離線累積 · 開發分支預覽</div>
</main>
<script>
(()=>{'use strict';
const canvas=document.getElementById('field'),ctx=canvas.getContext('2d'),W=540,H=900;
const $=id=>document.getElementById(id);
const squad=[
{name:'隊長・悠真',role:'突擊步槍',hp:100,max:100,damage:9,rate:.42,mag:30,ammo:30,reserve:150,reload:1.5,range:520,color:'#e9c18e',x:125},
{name:'狙擊手・凜',role:'精準狙擊',hp:86,max:86,damage:28,rate:1.25,mag:5,ammo:5,reserve:35,reload:2.2,range:650,color:'#9fc6df',x:197},
{name:'支援手・小葵',role:'醫療支援',hp:90,max:90,damage:7,rate:.68,mag:24,ammo:24,reserve:120,reload:1.6,range:470,color:'#f1c1d7',x:270},
{name:'爆破手・蓮',role:'榴彈發射器',hp:105,max:105,damage:18,rate:1.05,mag:6,ammo:6,reserve:36,reload:2.4,range:450,color:'#d9a56e',x:343},
{name:'突擊手・千夏',role:'霰彈槍',hp:96,max:96,damage:15,rate:.78,mag:8,ammo:8,reserve:48,reload:1.9,range:330,color:'#b9d69b',x:415}
];
let zombies=[],bullets=[],particles=[],floats=[],running=false,paused=false,over=false,last=0,spawn=0,elapsed=0,wave=1,kills=0,base=100,focusTarget=null,focusTime=0,fireTime=0,focusBuff=0,skillCd={heal:0,fire:0,focus:0},speed=1,bossSpawned=false,upgradeLevel=0;
const rand=(a,b)=>a+Math.random()*(b-a),clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
function say(t){$('log').innerHTML=t+'<br>'+ $('log').innerHTML.split('<br>').slice(0,5).join('<br>')}
function drawBar(x,y,w,p,color){ctx.fillStyle='#26313a';ctx.fillRect(x,y,w,5);ctx.fillStyle=color;ctx.fillRect(x,y,w*clamp(p,0,1),5)}
function spawnZombie(type='normal'){let cfg={normal:[35,42,25,'#78906d'],runner:[22,74,17,'#c8a36e'],armored:[105,22,50,'#667784'],boss:[620,15,110,'#9e6072']}[type];zombies.push({x:rand(48,492),y:-40,hp:cfg[0],max:cfg[0],speed:cfg[1],damage:cfg[2],color:cfg[3],r:type==='boss'?37:type==='armored'?23:17,type,hit:0,attack:0});}
function updateRoster(){ $('weaponStatus').innerHTML=squad.map(s=>s.name+'：'+s.ammo+'/'+s.reserve+(s.reloading>0?'（換彈中）':'')).join('<br>');$('upgradeInfo').textContent='武器強化等級：'+upgradeLevel+'｜每次升級提高全隊傷害 15%。';$('upgrade').disabled=kills<12; $('members').innerHTML=squad.map((s,i)=>'<div class="member"><div class="avatar">'+['悠','凜','葵','蓮','夏'][i]+'</div><div><b>'+s.name+'</b><small>'+s.role+' · '+Math.ceil(s.hp)+'/'+s.max+'</small><div class="bar"><i style="width:'+100*s.hp/s.max+'%"></i></div></div></div>').join('');}
function updateHud(){$('wave').textContent=Math.min(wave,5)+' / 5';$('base').textContent=Math.ceil(base)+'%';$('kills').textContent=kills;for(const k of ['heal','fire','focus'])$(k).disabled=skillCd[k]>0;$('pause').textContent=paused?'▶ 繼續':'Ⅱ 暫停';}
function spawnTick(dt){spawn-=dt;if(spawn<=0&&elapsed<105){let t=Math.random();spawnZombie(t<.17?'runner':t<.29?'armored':'normal');spawn=Math.max(.32,1.35-wave*.14);}if(elapsed>105&&!bossSpawned){spawnZombie('boss');bossSpawned=true;say('警告：大型變異喪屍出現！');}if(elapsed>125&&wave<5){wave++;elapsed=wave*25;}}
function targetFor(s){if(focusTarget&&focusTarget.hp>0)return focusTarget;let best=null,d=Infinity;for(const z of zombies){let q=Math.hypot(z.x-s.x,z.y-760);if(q<s.range&&q<d){best=z;d=q;}}return best;}
function beginReload(s){if(s.reloading>0||s.ammo===s.mag||s.reserve<=0)return;s.reloading=s.reload;say(s.name+' 開始換彈！');}\nfunction shoot(s,z){let dx=z.x-s.x,dy=z.y-755,len=Math.hypot(dx,dy)||1;bullets.push({x:s.x,y:755,vx:dx/len*470,vy:dy/len*470,damage:s.damage,life:1.3,team:true,aoe:s===squad[3]});}
function update(dt){elapsed+=dt;focusTime=Math.max(0,focusTime-dt);fireTime=Math.max(0,fireTime-dt);for(const k in skillCd)skillCd[k]=Math.max(0,skillCd[k]-dt);spawnTick(dt);
squad.forEach(s=>{if(s.hp<=0)return;if(s.reloading>0){s.reloading-=dt;if(s.reloading<=0){let load=Math.min(s.mag-s.ammo,s.reserve);s.ammo+=load;s.reserve-=load;s.reloading=0;say(s.name+' 完成換彈。');}}s.cool=(s.cool||rand(0,.3))-dt*(focusTime>0?1.7:1);if(s.cool<=0){let z=targetFor(s);if(z&&s.reloading<=0){if(s.ammo>0){shoot(s,z);s.ammo--;s.cool=s.rate;}else if(s.reserve>0){beginReload(s);}else{s.cool=.5;}}}});
for(let i=bullets.length-1;i>=0;i--){let b=bullets[i];b.x+=b.vx*dt;b.y+=b.vy*dt;b.life-=dt;let hit=zombies.find(z=>z.hp>0&&Math.hypot(z.x-b.x,z.y-b.y)<z.r+6);if(hit){hit.hp-=b.damage;hit.hit=.12;floats.push({x:hit.x+rand(-12,12),y:hit.y-10,text:String(b.damage),life:.65});if(b.aoe){for(const z of zombies)if(z!==hit&&Math.hypot(z.x-hit.x,z.y-hit.y)<68)z.hp-=b.damage*.5;}bullets.splice(i,1);continue;}if(b.life<=0||b.y<0||b.y>H)bullets.splice(i,1);}
for(let i=zombies.length-1;i>=0;i--){let z=zombies[i];z.hit=Math.max(0,z.hit-dt);if(z.hp<=0){kills++;for(let n=0;n<7;n++)particles.push({x:z.x,y:z.y,vx:rand(-70,70),vy:rand(-90,90),life:.35,color:z.color});zombies.splice(i,1);continue;}let near=squad.reduce((a,s)=>s.hp>0&&Math.hypot(s.x-z.x,755-z.y)<Math.hypot(a.x-z.x,755-z.y)?s:a,squad[0]);let dx=near.x-z.x,dy=755-z.y,dist=Math.hypot(dx,dy);if(dist>z.r+18){z.x+=dx/dist*z.speed*dt;z.y+=dy/dist*z.speed*dt;}else{z.attack-=dt;if(z.attack<=0){near.hp=Math.max(0,near.hp-z.damage);z.attack=.9;}}if(z.y>840){base=Math.max(0,base-z.damage*.32);zombies.splice(i,1);}}
particles.forEach(p=>{p.x+=p.vx*dt;p.y+=p.vy*dt;p.life-=dt});particles=particles.filter(p=>p.life>0);floats.forEach(f=>{f.y-=35*dt;f.life-=dt});floats=floats.filter(f=>f.life>0);
if(base<=0||squad.every(s=>s.hp<=0)){finish(false);return;}if(bossSpawned&&zombies.length===0&&elapsed>105){finish(true);return;}updateRoster();updateHud();}
function draw(){ctx.clearRect(0,0,W,H);ctx.fillStyle='#77776f';ctx.fillRect(0,0,W,H);
ctx.fillStyle='#85847a';for(let y=0;y<H;y+=180){ctx.fillRect(0,y,W,3);ctx.fillStyle='#696e6b';ctx.fillRect(0,y+88,W,2);ctx.fillStyle='#85847a';}
ctx.fillStyle='#555b5c';ctx.fillRect(12,0,14,H);ctx.fillRect(W-26,0,14,H);
for(let i=0;i<14;i++){let x=(i*83+25)%W,y=(i*137+45)%H;ctx.fillStyle=i%2?'#a7a294':'#626867';ctx.beginPath();ctx.arc(x,y,rand(2,5),0,Math.PI*2);ctx.fill();}
ctx.fillStyle='#252c31';ctx.fillRect(0,824,W,76);ctx.fillStyle='#c4b69d';ctx.fillRect(0,820,W,5);ctx.fillStyle='#3b464b';ctx.fillRect(0,810,W,9);
ctx.fillStyle='#d4c4a5';ctx.font='bold 15px system-ui';ctx.fillText('DEFENSE LINE',205,866);
ctx.fillStyle='#d8d5cb';ctx.font='bold 16px system-ui';ctx.fillText('廢 校 一 號',18,34);ctx.font='12px system-ui';ctx.fillText('WAVE '+Math.min(wave,5)+'   '+Math.floor(elapsed)+'s',18,54);
ctx.fillStyle='#27323a';ctx.fillRect(424,18,98,30);ctx.fillStyle='#f5d28d';ctx.fillText('速度 '+speed.toFixed(1)+'x',438,38);
zombies.forEach(z=>{ctx.save();ctx.translate(z.x,z.y+Math.sin(elapsed*7+z.x)*2);ctx.rotate(Math.sin(elapsed*5+z.y)*.035);ctx.fillStyle=z.hit>0?'#fff':z.color;ctx.beginPath();ctx.ellipse(0,5,z.r*.72,z.r,0,0,Math.PI*2);ctx.fill();ctx.fillStyle='#d9d1bf';ctx.beginPath();ctx.arc(0,-z.r*.55,z.r*.57,0,Math.PI*2);ctx.fill();ctx.fillStyle='#8b313b';ctx.fillRect(-7,-z.r*.62,4,4);ctx.fillRect(4,-z.r*.62,4,4);ctx.strokeStyle='#3b3431';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(-z.r*.5,8);ctx.lineTo(-z.r,22+Math.sin(elapsed*9+z.x)*4);ctx.moveTo(z.r*.5,8);ctx.lineTo(z.r,22-Math.sin(elapsed*9+z.x)*4);ctx.stroke();drawBar(-z.r,-z.r-14,z.r*2,z.hp/z.max,z.type==='boss'?'#e65d69':'#7ed18e');if(z===focusTarget){ctx.strokeStyle='#ffe08a';ctx.lineWidth=3;ctx.beginPath();ctx.arc(0,0,z.r+8,0,Math.PI*2);ctx.stroke();}if(z.type==='runner'){ctx.fillStyle='#f1d7a2';ctx.font='bold 9px system-ui';ctx.fillText('快',-3,4);}if(z.type==='armored'){ctx.strokeStyle='#aebdc5';ctx.lineWidth=4;ctx.strokeRect(-z.r*.65,-z.r*.25,z.r*1.3,z.r*.8);}if(z.type==='boss'){ctx.fillStyle='#fff';ctx.font='bold 12px system-ui';ctx.fillText('變異首領',-30,-z.r-23);}ctx.restore();});
bullets.forEach(b=>{ctx.strokeStyle=b.aoe?'#ffb64f':'#ffe18a';ctx.lineWidth=b.aoe?5:3;ctx.beginPath();ctx.moveTo(b.x,b.y);ctx.lineTo(b.x-b.vx*.025,b.y-b.vy*.025);ctx.stroke();});
squad.forEach((s,i)=>{if(s.hp<=0)return;ctx.save();ctx.translate(s.x,755);ctx.fillStyle='#1e2832';ctx.beginPath();ctx.ellipse(0,18,19,12,0,0,Math.PI*2);ctx.fill();ctx.fillStyle=s.color;ctx.beginPath();ctx.arc(0,-8,13,0,Math.PI*2);ctx.fill();ctx.fillStyle='#303a47';ctx.fillRect(-12,2,24,27);ctx.fillStyle='#d8c6ac';ctx.fillRect(-3,-10,3,3);ctx.fillRect(3,-10,3,3);ctx.strokeStyle='#242a31';ctx.lineWidth=5;ctx.beginPath();ctx.moveTo(8,8);ctx.lineTo(22,-2);ctx.stroke();ctx.fillStyle='#fff';ctx.font='11px system-ui';ctx.fillText(['隊','狙','醫','爆','突'][i],-4,48);ctx.restore();});
particles.forEach(p=>{ctx.globalAlpha=clamp(p.life/.35,0,1);ctx.fillStyle=p.color;ctx.beginPath();ctx.arc(p.x,p.y,3,0,Math.PI*2);ctx.fill();ctx.globalAlpha=1;});floats.forEach(f=>{ctx.globalAlpha=clamp(f.life/.65,0,1);ctx.fillStyle='#fff1a9';ctx.font='bold 18px system-ui';ctx.strokeStyle='#382c29';ctx.lineWidth=3;ctx.strokeText(f.text,f.x,f.y);ctx.fillText(f.text,f.x,f.y);ctx.globalAlpha=1;});
if(paused&&running){ctx.fillStyle='#111a';ctx.fillRect(0,0,W,H);ctx.fillStyle='#fff';ctx.font='bold 36px system-ui';ctx.fillText('PAUSED',190,440);}
}
function loop(t){let dt=Math.min(.04,(t-last)/1000||0);last=t;if(running&&!paused&&!over)update(dt*speed);draw();requestAnimationFrame(loop);}
function start(){upgradeLevel=0;squad.forEach(s=>{s.ammo=s.mag;s.reserve=s.mag*5;s.reloading=0;});zombies=[];bullets=[];particles=[];floats=[];elapsed=0;wave=1;kills=0;base=100;focusTarget=null;bossSpawned=false;spawn=.4;skillCd={heal:0,fire:0,focus:0};squad.forEach(s=>{s.hp=s.max;s.ammo=s.mag;s.reserve=s.mag*5;s.reloading=0;});running=true;paused=false;over=false;$('start').hidden=true;$('end').hidden=true;say('小隊進入防守位置。喪屍開始接近！');updateRoster();updateHud();}
function finish(win){over=true;running=false;$('endTitle').textContent=win?'防守成功！':'防線失守';$('endText').textContent=win?'你們守住了廢校一號，成功擊退變異首領！擊倒喪屍：'+kills:'小隊無法繼續作戰。擊倒喪屍：'+kills+'。調整戰術後再試一次。';$('end').hidden=false;}
function skill(k){if(!running||over||skillCd[k]>0)return;if(k==='heal'){let any=false;squad.forEach(s=>{if(s.hp>0&&s.hp<s.max){s.hp=Math.min(s.max,s.hp+35);any=true;}});if(!any){say('全隊狀態良好，急救包保留。');return;}skillCd.heal=16;say('急救包啟用：全隊恢復生命。');}if(k==='fire'){let cx=focusTarget&&focusTarget.hp>0?focusTarget.x:270,cy=focusTarget&&focusTarget.hp>0?focusTarget.y:330;zombies.forEach(z=>{if(Math.hypot(z.x-cx,z.y-cy)<150){z.hp-=95;floats.push({x:z.x,y:z.y,text:'95',life:.7});}});for(let i=0;i<24;i++)particles.push({x:cx+rand(-90,90),y:cy+rand(-90,90),vx:rand(-70,70),vy:rand(-80,80),life:.5,color:'#ff9b43'});skillCd.fire=22;say('燃燒彈命中！範圍內喪屍受到重創。');}if(k==='focus'){focusTime=6;skillCd.focus=25;say('集火指令：全隊攻速提升六秒！');}updateRoster();updateHud();}
function reloadAll(){if(!running||paused||over)return;squad.forEach(beginReload);updateRoster();}\nfunction upgradeAll(){if(kills<12)return;kills-=12;upgradeLevel++;squad.forEach(s=>{s.damage=Math.round(s.damage*1.15);});say('全隊武器升級！攻擊力提升 15%。');updateRoster();updateHud();}\nfunction togglePause(){if(!running||over)return;paused=!paused;updateHud();}
canvas.addEventListener('pointerdown',e=>{if(!running||paused||over)return;const r=canvas.getBoundingClientRect(),x=(e.clientX-r.left)/r.width*W,y=(e.clientY-r.top)/r.height*H;let best=null,d=42;zombies.forEach(z=>{let q=Math.hypot(z.x-x,z.y-y);if(q<d){best=z;d=q;}});if(best){focusTarget=best;say('集火目標已指定。');}});
canvas.addEventListener('click',e=>{const r=canvas.getBoundingClientRect(),x=(e.clientX-r.left)/r.width*W,y=(e.clientY-r.top)/r.height*H;if(x>415&&y<60){speed=speed===1?1.5:speed===1.5?2:1;updateHud();}});
